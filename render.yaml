# Render blueprint for the Wearly backend.
# Set the secret env values in the Render dashboard (do NOT commit real secrets).
services:
  - type: web
    name: wearly-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # set to your MongoDB Atlas URI
      - key: JWT_SECRET
        sync: false          # set to a long random string
      - key: JWT_EXPIRY
        value: 7d
      - key: CORS_ORIGIN
        sync: false          # e.g. https://your-app.vercel.app
      - key: COOKIE_SECURE
        value: "true"        # required for sameSite=none (HTTPS only)
      - key: COOKIE_SAMESITE
        value: none          # allows cross-origin cookies (Vercel → Render)
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Wearly Admin
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

